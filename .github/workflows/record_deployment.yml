name: Record Pact Broker deployment

on:
  workflow_call:
    inputs: &record_deployment_inputs
      app_version:
        description: Deployment version from the pipeline, used for logging and traceability only
        required: true
        type: string
      environment:
        description: Pact Broker environment name to record the deployment against
        required: true
        type: string
      pacticipant:
        description: Optional Pact Broker pacticipant name override; defaults to the repository name
        required: false
        default: ''
        type: string
      pacticipant_version:
        description: Optional Pact Broker pacticipant version to record as deployed; defaults to github.sha so it matches published provider verification results
        required: false
        default: ''
        type: string
      application_instance:
        description: Optional Pact Broker application instance name, used only to distinguish multiple deployments in the same environment
        required: false
        default: ''
        type: string
    secrets:
      PACT_BROKER_URL:
        required: true
      HMPPS_PACT_BROKER_USERNAME:
        required: true
      HMPPS_PACT_BROKER_PASSWORD:
        required: true
  workflow_dispatch:
    inputs: *record_deployment_inputs

permissions:
  contents: read

jobs:
  record_deployment:
    name: Record deployment in Pact Broker
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment
        shell: bash
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_PACTICIPANT: ${{ inputs.pacticipant }}
          INPUT_PACTICIPANT_VERSION: ${{ inputs.pacticipant_version }}
          INPUT_APPLICATION_INSTANCE: ${{ inputs.application_instance }}
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}
          PACT_BROKER_ERROR_ON_UNKNOWN_OPTION: 'true'
        run: |
          set -euo pipefail

          pacticipant="${INPUT_PACTICIPANT:-${GITHUB_REPOSITORY#*/}}"
          pacticipant_version="${INPUT_PACTICIPANT_VERSION:-$GITHUB_SHA}"

          command=(
            pact-broker
            record-deployment
            --environment "$INPUT_ENVIRONMENT"
            --pacticipant "$pacticipant"
            --version "$pacticipant_version"
          )

          if [[ -n "$INPUT_APPLICATION_INSTANCE" ]]; then
            command+=(--application-instance "$INPUT_APPLICATION_INSTANCE")
          fi

          echo "Recording Pact Broker deployment"
          echo "  pacticipant: $pacticipant"
          echo "  pacticipant version: $pacticipant_version"
          echo "  environment: $INPUT_ENVIRONMENT"
          echo "  app version: $INPUT_APP_VERSION"

          docker run --rm \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_USERNAME \
            -e PACT_BROKER_PASSWORD \
            -e PACT_BROKER_ERROR_ON_UNKNOWN_OPTION \
            pactfoundation/pact-cli:latest \
            "${command[@]}"
