name: Pact boolean test
run-name: Pact boolean test - consumer=${{ inputs.pact_consumer_deployment }} provider=${{ inputs.pact_provider_deployment }}

on:
  push:
    branches:
      - "add-pact-record-deployment-step"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment label for testing conditional workflow logic
        required: true
        default: dev
        type: string
      pact_consumer_deployment:
        description: Run Pact can-i-deploy before deployment and record the successful deployment
        required: false
        default: false
        type: boolean
      pact_provider_deployment:
        description: Record the successful deployment in Pact Broker
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  show_inputs:
    name: Show selected inputs
    runs-on: ubuntu-latest
    steps:
      - name: Print workflow inputs
        run: |
          echo "environment=${{ inputs.environment }}"
          echo "pact_consumer_deployment=${{ inputs.pact_consumer_deployment }}"
          echo "pact_provider_deployment=${{ inputs.pact_provider_deployment }}"

  pact_can_i_deploy:
    name: Check Pact deployment compatibility
    runs-on: ubuntu-latest
    needs: show_inputs
    if: ${{ inputs.pact_consumer_deployment }}
    steps:
      - name: Simulate Pact can-i-deploy
        run: |
          echo "Simulating pact can-i-deploy for ${{ github.event.repository.name }}"
          echo "version=${{ github.sha }}"
          echo "to_environment=${{ inputs.environment }}"

  deploy_env:
    name: Simulate deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs:
      - show_inputs
      - pact_can_i_deploy
    # GitHub Actions skips jobs whose dependencies are skipped unless the condition uses always().
    if: ${{ always() && (!inputs.pact_consumer_deployment || needs.pact_can_i_deploy.result == 'success') }}
    steps:
      - name: Simulate deployment
        run: |
          echo "Deployment would run here"
          echo "consumer gate result=${{ needs.pact_can_i_deploy.result || 'skipped' }}"

  pact_record_deployment:
    name: Record successful deployment in Pact Broker
    runs-on: ubuntu-latest
    needs:
      - deploy_env
    if: ${{ always() && (inputs.pact_consumer_deployment || inputs.pact_provider_deployment) && needs.deploy_env.result == 'success' }}
    steps:
      - name: Simulate Pact deployment recording
        run: |
          echo "Simulating pact deployment record for ${{ github.event.repository.name }}"
          echo "version=${{ github.sha }}"
          echo "environment=${{ inputs.environment }}"


