name: Trigger Pact tests workflow

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - "add-pact-record-deployment-step"
  workflow_dispatch:

jobs:
  trigger_pact_tests:
    name: Trigger Pact tests
    runs-on: ubuntu-latest
    steps:
      - name: Create issue using REST API
        run: |
          curl --request POST \
          --url https://api.github.com/repos/ministryofjustice/hmpps-person-record/actions/workflows/pact_provider_verification.yml/dispatches \
          --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
          --header 'content-type: application/json' \
          --data '{
            "consumer": "hmpps-single-accommodation-service-api",
            "consumerBranch": "feature/pact-cpr-consumer-tests"
          }' \
          --fail