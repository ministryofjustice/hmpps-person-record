name: Pact deployment flow test
run-name: Pact deployment flow test - env=${{ inputs.environment }} consumer=${{ inputs.pact_consumer_deployment }} provider=${{ inputs.pact_provider_deployment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment label for testing conditional workflow logic
        required: true
        default: dev
        type: string
      pact_consumer_deployment:
        description: Run Pact can-i-deploy before deployment and record the successful deployment
        required: false
        default: false
        type: boolean
      pact_provider_deployment:
        description: Record the successful deployment in Pact Broker
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  show_inputs:
    name: Show selected inputs
    runs-on: ubuntu-latest
    steps:
      - name: Print workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          cat <<EOF
          environment=${{ inputs.environment }}
          pact_consumer_deployment=${{ inputs.pact_consumer_deployment }}
          pact_provider_deployment=${{ inputs.pact_provider_deployment }}
          EOF

  pact_deployment_flow:
    name: Simulate Pact deployment flow
    runs-on: ubuntu-latest
    needs: show_inputs
    steps:
      - name: Check Pact can-i-deploy
        if: ${{ inputs.pact_consumer_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Simulating pact can-i-deploy for ${{ github.event.repository.name }}"
          echo "version=${{ github.sha }}"
          echo "to_environment=${{ inputs.environment }}"

      - name: Simulate deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment would run here"
          echo "environment=${{ inputs.environment }}"

      - name: Record successful deployment in Pact Broker
        if: ${{ inputs.pact_consumer_deployment || inputs.pact_provider_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Simulating pact deployment record for ${{ github.event.repository.name }}"
          echo "version=${{ github.sha }}"
          echo "environment=${{ inputs.environment }}"



