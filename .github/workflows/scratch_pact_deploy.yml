name: Scratch Pact deploy flow
run-name: Scratch Pact deploy flow - env=${{ inputs.environment }} consumer=${{ inputs.pact_consumer_deployment }}

on:
  push:
    branches:
      - "add-pact-record-deployment-step"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment label for the scratch Pact flow
        required: true
        default: dev
        type: string
      app_version:
        description: The version of the application to deploy
        required: true
        default: 1.0.0
        type: string
      pact_consumer_deployment:
        description: Run Pact can-i-deploy before deployment and record the successful deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  can_i_deploy:
    name: Check Pact can-i-deploy
    if: ${{ inputs.pact_consumer_deployment }}
    uses: ./.github/workflows/pact_can_i_deploy.yml
    secrets: inherit
    with:
      to_environment: ${{ inputs.environment }}
      app_version: ${{ inputs.app_version }}

  simulate_deployment:
    name: Simulate deployment
    needs: can_i_deploy
    if: ${{ !inputs.pact_consumer_deployment || needs.can_i_deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Simulate deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment would run here"
          echo "environment=${{ inputs.environment }}"

  record_deployment:
    name: Record successful deployment in Pact Broker
    needs: simulate_deployment
    uses: ./.github/workflows/pact_record_deployment.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      app_version: ${{ inputs.app_version }}
