name: Pact Provider Verification
run-name: Pact verify - ${{ inputs.consumerName && inputs.consumerBranch && format('{0}@{1}', inputs.consumerName, inputs.consumerBranch) || github.ref_name || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      consumerName:
        required: false
        description: Consumer name from broker webhook payload
        type: string
      consumerBranch:
        required: false
        description: Consumer branch from broker webhook payload
        type: string
      publishResults:
        required: false
        description: Publish verification results to broker
        type: boolean
        default: true
      providerAppVersion:
        required: true
        description: Application version matching the provider checkout reference
        type: string
      providerBranch:
        required: false
        description: Provider branch / provider version branch
        type: string
        default: ''
      providerTag:
        required: false
        description: Provider tag / provider version tag
        type: string
        default: ''
  workflow_call:
    inputs:
      consumerName:
        required: false
        description: Consumer name from broker webhook payload
        type: string
      consumerBranch:
        required: false
        description: Consumer branch from broker webhook payload
        type: string
      publishResults:
        required: false
        description: Publish verification results to broker
        type: boolean
        default: true
      providerAppVersion:
        required: true
        description: Application version
        type: string
      providerTag:
        required: false
        description: Provider tag / provider version tag
        type: string
        default: ${{ github.sha }}
      providerBranch:
        required: false
        description: Provider branch / provider version branch
        type: string
        default: ${{ github.ref_name }}
  repository_dispatch:
    types:
      - pact_changed

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'repository_dispatch' &&
      format('pact-provider-verification-{0}-{1}-{2}',
        github.event.client_payload.consumerName || 'unknown',
        github.event.client_payload.consumerBranch || 'unknown',
        github.run_id)
      || format('pact-provider-verification-{0}-{1}',
        github.ref_name || github.ref,
        github.run_id) }}
  cancel-in-progress: false

jobs:
  pact-verify:
    name: Verify provider pacts
    runs-on: ubuntu-latest
    steps:
      - name: Resolve provider version and checkout reference
        id: provider-ref
        shell: bash
        env:
          INPUT_PROVIDER_APP_VERSION: ${{ github.event.client_payload.providerAppVersion || inputs.providerAppVersion }}
          WEBHOOK_PROVIDER_TAG: ${{ github.event.client_payload.providerTag }}
          INPUT_PROVIDER_TAG: ${{ inputs.providerTag }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_PROVIDER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${INPUT_PROVIDER_APP_VERSION//[[:space:]]/}" ||
                "$INPUT_PROVIDER_APP_VERSION" == *[[:cntrl:]]* ]]; then
            echo "::error::providerAppVersion is required and must not contain control characters."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            if ! ref="$(printf '%s' "$WEBHOOK_PROVIDER_TAG" | jq -Rsre '
              if test("[[:cntrl:]]") then error("Invalid control character") else . end
              | split(",") | map(gsub("^ +| +$"; ""))
              | map(select(test("^[0-9a-fA-F]{40}$"))) | unique
              | if length == 1 then .[0] else error("Expected exactly one commit SHA") end
            ')"; then
              echo "::error::Webhook providerTag must contain exactly one full commit SHA in its comma-separated tags."
              exit 1
            fi
          else
            ref="${INPUT_PROVIDER_TAG:-$DEFAULT_PROVIDER_REF}"
            if [[ "$ref" == -* || "$ref" == *,* ]] || ! git check-ref-format --allow-onelevel "$ref"; then
              echo "::error::providerTag must be a single valid Git reference."
              exit 1
            fi
          fi

          printf 'version=%s\nref=%s\n' "$INPUT_PROVIDER_APP_VERSION" "$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.provider-ref.outputs.ref }}

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Start Containers
        run: make e2e-start-containers

      - name: Verify pacts
        run: ./gradlew pactTest
        env:
          PACT_PUBLISH_RESULTS: ${{ github.event_name == 'repository_dispatch' || inputs.publishResults }}
          PACT_ENABLE_PENDING: ${{ github.event_name != 'repository_dispatch' }}
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}
          GITHUB_BRANCH: ${{ github.event.client_payload.providerBranch || inputs.providerBranch || github.ref_name }}
          PACT_CONSUMER_NAME: ${{ github.event.client_payload.consumerName || inputs.consumerName }}
          PACT_CONSUMER_BRANCH: ${{ github.event.client_payload.consumerBranch || inputs.consumerBranch }}
          PACT_PROVIDER_APP_VERSION: ${{ steps.provider-ref.outputs.version }}
          PACT_PROVIDER_TAG: ${{ steps.provider-ref.outputs.ref }}

      - name: Upload the test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pact-test-results
          path: |
            build/reports/tests
